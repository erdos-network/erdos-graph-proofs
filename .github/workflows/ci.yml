name: Verify Erdos Graph

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Verus installation
        id: cache-verus
        uses: actions/cache@v4
        with:
          path: tools/verus-bin
          key: verus-${{ runner.os }}-${{ hashFiles('tools/install-verus.sh') }}

      - name: Install Verus
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: bash tools/install-verus.sh

      - name: Install required Rust toolchain
        run: |
          REQUIRED_TOOLCHAIN=$(tools/verus-bin/verus --version 2>&1 | grep -oP 'required rust toolchain \K\S+' || true)
          if [ -n "$REQUIRED_TOOLCHAIN" ]; then
            echo "Installing Rust toolchain $REQUIRED_TOOLCHAIN required by Verus..."
            rustup install "$REQUIRED_TOOLCHAIN"
          fi

      - name: Add Verus to PATH
        run: echo "$GITHUB_WORKSPACE/tools/verus-bin" >> $GITHUB_PATH

      - name: Verify Verus installation
        run: verus --version

      - name: Run verification
        run: make verify

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            verified/
            !verified/target/
